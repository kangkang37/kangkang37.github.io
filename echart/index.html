<!-- // 通过jsDelivr的CDN引入echarts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@4.8.0/dist/echarts.min.js"></script>
<!-- // 使用GL里的各种组件时需要添加，否则可不需要 -->
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@1.1.1/dist/echarts-gl.min.js"></script>
<script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
        var myChart = echarts.init(document.getElementById('echarts249'));

        // 指定图表的配置项和数据
        var option = (() => {
  // === Data config ===
  const months = ['2024-07','2024-08','2024-09','2024-10','2024-11','2024-12','2025-01','2025-02','2025-03','2025-04','2025-05','2025-06','2025-07','2025-08','2025-09'];
  const visitors = [5,9,12,13,14,50,150,320,540,780,950,1100,1200,1280,1351];
  const views = [20,40,60,70,75,120,200,300,380,460,500,530,550,560,563];

  const duration = 12; // last 12 months
  const startIndex = Math.max(0, months.length - duration);
  const xData = months.slice(startIndex);
  const vData = visitors.slice(startIndex);
  const cData = views.slice(startIndex);

  return {
    title: {
      text: 'Monthly Visitors & Page Views',
      left: 'center',
      top: 10
    },
    tooltip: { trigger: 'axis' },
    legend: {
      data: ['Visitors', 'Page Views'],
      textStyle: { color: '#598DB5' },
      top: 40,
      left: 'center'
    },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: {
      type: 'category',
      boundaryGap: false,
      data: xData,
      axisLabel: { textStyle: { color: '#598DB5' } }
    },
    yAxis: {
      type: 'value',
      axisLabel: { textStyle: { color: '#598DB5' } }
    },
    series: [
      {
        name: 'Visitors',
        type: 'line',
        smooth: true,
        data: vData,
        areaStyle: { color: 'rgba(74, 109, 136, 0.36)' }
      },
      {
        name: 'Page Views',
        type: 'line',
        smooth: true,
        data: cData,
        areaStyle: { color: 'rgba(240,173,78,0.2)' }
      }
    ]
  };
})()

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);

        // this.chartDjqx1.setOption(chartOption);
        window.addEventListener("resize", ()=>{
                this.myChart.resize();
        })

</script>
